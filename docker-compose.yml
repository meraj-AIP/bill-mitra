services:
  bill-mitra:
    build: .
    image: bill-mitra:latest
    ports:
      # Local only: in front of the internet sits nginx, which also writes the access log.
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - bill-mitra-data:/srv/backend/var
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  bill-mitra-data:
